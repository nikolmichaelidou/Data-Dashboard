<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arcane popularity dashboard — import Google Trends or use simulated data to visualize S1/S2 release spikes.">
    <title>Data Dashboard</title>
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Data Dashboard</h1>
    </header>
    <main>
        <section id="data-visualization">
            <h2>Data Visualization</h2>
            <p>Arcane popularity over time (simulated demo; replace with real data when available).</p>
            <div id="controls">
                <label><input id="chk-search" type="checkbox" checked> Search interest (0–100)</label>
                <label><input id="chk-social" type="checkbox" checked> Social mentions (0–100)</label>
                <a id="open-trends" href="https://trends.google.com/trends/explore?q=Arcane" target="_blank" rel="noopener">Open Google Trends</a>
                <label>
                  <input type="file" id="csv-input" accept=".csv">
                  Import Google Trends CSV
                </label>
                <button id="reset-data" class="btn" type="button" title="Reset to simulated data">Reset data</button>
                <span class="divider">|</span>
                <button id="show-chart" class="btn btn-active" type="button">Chart view</button>
                <button id="show-trends" class="btn" type="button">Trends embed</button>
            </div>
            <div id="chart-container">
                <canvas id="popularityChart" aria-label="Line chart showing Arcane popularity over time" role="img"></canvas>
            </div>
            <div id="trends-container" style="display: none;">
                <iframe id="trends-iframe" 
                        src="https://trends.google.com/trends/embed/explore/TIMESERIES?req=%7B%22comparisonItem%22%3A%5B%7B%22keyword%22%3A%22Arcane%22%2C%22geo%22%3A%22%22%2C%22time%22%3A%222021-01-01%202025-12-31%22%7D%5D%2C%22category%22%3A0%2C%22property%22%3A%22%22%7D&tz=-60&eq=q%3DArcane"
                        frameborder="0"
                        allowfullscreen>
                </iframe>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Data Dashboard</p>
    </footer>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
